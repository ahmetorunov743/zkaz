<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NXT Fit Out Technical Service</title>
  <meta name="description" content="NXT Fit Out Technical Service — premium fit-out and restoration in Dubai.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="brand__logo" src="assets/logo/nxt-logo-black.svg" alt="NXT Fit Out Technical Service" width="150" height="56">
    </a>
    <div class="header__actions">
      <div class="lang" role="group" data-i18n-attr="aria-label:lang.label">
        <button type="button" class="lang__btn" data-lang="en">EN</button>
        <button type="button" class="lang__btn" data-lang="ru">RU</button>
        <button type="button" class="lang__btn" data-lang="ar">AR</button>
      </div>
      <a class="icon-btn" href="https://wa.me/971558208753" target="_blank" rel="noopener" data-i18n-attr="aria-label:header.whatsapp">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5l1.1-3.6A8 8 0 1 1 8.4 18.6z"/><path d="M9.2 8.6c.2-.5.5-.5.8-.5h.5c.2 0 .4.1.5.4l.6 1.5c.1.2 0 .4-.1.6l-.4.5c-.1.1-.1.3 0 .5.6 1 1.4 1.8 2.4 2.3.2.1.4.1.5-.1l.5-.6c.2-.2.4-.2.6-.1l1.4.7c.2.1.3.3.3.5 0 .9-.7 1.7-1.7 1.7-3.1-.2-6.1-3-6.3-6.1 0-.5.2-1 .4-1.3z" fill="currentColor" stroke="none"/></svg>
      </a>
      <a class="icon-btn" href="#" target="_blank" rel="noopener" data-i18n-attr="aria-label:header.instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
    </div>
  </header>

  <main class="hero" id="hero">
    <section class="drum drum--left" id="drum-left" data-side="left" tabindex="0" data-i18n-attr="aria-label:drum.left">
      <div class="drum__window"><div class="drum__track"></div><div class="drum__fade"></div></div>
      <div class="drum__pointer" aria-hidden="true"></div>
    </section>

    <section class="center" id="center" aria-live="polite">
      <div class="stage" id="stage"></div>
    </section>

    <section class="drum drum--right" id="drum-right" data-side="right" tabindex="0" data-i18n-attr="aria-label:drum.right">
      <div class="drum__window"><div class="drum__track"></div><div class="drum__fade"></div></div>
      <div class="drum__pointer" aria-hidden="true"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer__inner">
      <div class="footer__brand">
        <img src="assets/logo/nxt-logo-white.svg" alt="NXT Fit Out Technical Service" width="150" height="56">
        <p data-i18n="footer.tagline"></p>
      </div>
      <div class="footer__col">
        <h3 data-i18n="footer.contacts"></h3>
        <a class="footer__phone" href="tel:+971558208753" dir="ltr">+971 55 820 8753</a>
        <div class="footer__social">
          <a class="icon-btn icon-btn--dark" href="https://wa.me/971558208753" target="_blank" rel="noopener" data-i18n-attr="aria-label:header.whatsapp">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5l1.1-3.6A8 8 0 1 1 8.4 18.6z"/><path d="M9.2 8.6c.2-.5.5-.5.8-.5h.5c.2 0 .4.1.5.4l.6 1.5c.1.2 0 .4-.1.6l-.4.5c-.1.1-.1.3 0 .5.6 1 1.4 1.8 2.4 2.3.2.1.4.1.5-.1l.5-.6c.2-.2.4-.2.6-.1l1.4.7c.2.1.3.3.3.5 0 .9-.7 1.7-1.7 1.7-3.1-.2-6.1-3-6.3-6.1 0-.5.2-1 .4-1.3z" fill="currentColor" stroke="none"/></svg>
          </a>
          <a class="icon-btn icon-btn--dark" href="#" target="_blank" rel="noopener" data-i18n-attr="aria-label:header.instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg>
          </a>
        </div>
      </div>
      <div class="footer__col">
        <h3 data-i18n="footer.legal"></h3>
        <a href="privacy.html" data-i18n="footer.privacy"></a>
        <a href="terms.html" data-i18n="footer.terms"></a>
      </div>
    </div>
    <div class="footer__bottom">
      <span>© <span class="js-year"></span> NXT Fit Out Technical Service. <span data-i18n="footer.rights"></span></span>
      <span class="footer__version js-version"></span>
    </div>
  </footer>

  <!-- Center panels (cloned by script.js) -->
  <template id="tpl-welcome">
    <article class="panel panel--welcome">
      <p class="eyebrow" data-i18n="welcome.eyebrow"></p>
      <h1 class="welcome__title" data-i18n="welcome.title"></h1>
      <p class="welcome__founded" data-i18n="welcome.founded"></p>
      <p class="welcome__text" data-i18n="welcome.text"></p>
      <p class="welcome__hint"><span class="hint-icon" aria-hidden="true"></span><span class="js-hint"></span></p>
    </article>
  </template>

  <template id="tpl-project">
    <article class="panel panel--project">
      <figure class="gallery">
        <div class="gallery__main"><img class="js-main" alt=""></div>
        <div class="gallery__thumbs js-thumbs"></div>
      </figure>
      <div class="project__head">
        <span class="chip js-work"></span>
        <span class="project__count js-count"></span>
      </div>
      <h2 class="project__title js-title"></h2>
      <dl class="meta">
        <div><dt data-i18n="project.location"></dt><dd class="js-location"></dd></div>
        <div><dt data-i18n="project.year"></dt><dd class="js-year-p"></dd></div>
        <div><dt data-i18n="project.area"></dt><dd class="js-area"></dd></div>
      </dl>
      <p class="project__desc js-desc"></p>
      <button type="button" class="link-btn js-back"><span aria-hidden="true">←</span> <span data-i18n="project.back"></span></button>
    </article>
  </template>

  <script src="i18n.js"></script>
  <script src="projects.js"></script>
  <script src="script.js"></script>
</body>
</html>
