name: Orvena Create (Android)

on:
  push:
    paths:
      - "orvena-create/**"
      - ".github/workflows/orvena-create.yml"
  workflow_dispatch:

concurrency:
  group: orvena-create-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify export
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: orvena-create
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, player template, editor
        run: ./gradlew --stacktrace :core:test :exporter:test :player:assembleRelease :app:assembleDebug

      - name: Export the sample with the real template (JVM)
        run: ./gradlew :exporter:test --tests '*SmokeExportTest*' -PtemplateApk="$PWD/player/build/outputs/apk/release/player-release-unsigned.apk"

      - name: Check the exported APK with Android build tools
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK=exporter/build/smoke/counter.apk
          "$BT/apksigner" verify --verbose --min-sdk-version 26 "$APK"
          "$BT/zipalign" -c -P 16 4 "$APK" && echo "zipalign OK"
          "$BT/aapt2" dump badging "$APK" > badging.txt
          head -5 badging.txt
          grep -q "package: name='com.orvenacreate.smoke.counter' versionCode='5' versionName='1.2.3'" badging.txt
          grep -q "application-label:'Счётчик'" badging.txt
          grep -q "launchable-activity: name='com.orvenadigital.create.player.PlayerActivity'" badging.txt
          echo "Exported APK is valid"

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/OrvenaCreate-0.0.2-demo.apk
          cp exporter/build/smoke/counter.apk out/exported-counter.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: orvena-create-0.0.2
          path: orvena-create/out/*.apk
          if-no-files-found: error

  emulator:
    name: Run on emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: orvena-create-0.0.2
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash orvena-create/ci/emulator-smoke.sh apks

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: shots/
          if-no-files-found: ignore
